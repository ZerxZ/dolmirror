name: 🔄 Sync GitGud to Forgejo (Master Only)

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 2 * * *' 

jobs:
  shallow-sync:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 从 GitGud 浅克隆 master 分支 (最新 100 条)
        run: |
          # 仅拉取 master 分支，深度设为 100
          git clone --depth 100 --single-branch --branch master https://gitgud.io/Vrelnir/degrees-of-lewdity.git repo-sync
      
      - name: 📤 推送至 Forgejo 组织仓库
        run: |
          cd repo-sync
          # 添加 Forgejo 组织项目为远程地址
          git remote add forgejo https://${{ secrets.FORGEJO_USERNAME }}:${{ secrets.FORGEJO_TOKEN }}@${{ secrets.FORGEJO_DOMAIN }}/${{ secrets.FORGEJO_ORG }}/degrees-of-lewdity.git
          
          # 强制推送 master 分支
          # (浅克隆由于缺少完整历史，日常同步时需要加 -f 参数来覆盖更新目标仓库)
          git push -f forgejo master
