name: 🔄 Sync GitGud to Forgejo (Smart Update)

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 2 * * *' 

jobs:
  smart-update:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 从 Forgejo 浅克隆 (深度 1)
        run: |
          # 从您的服务器只拉取最新的 1 个提交
          git clone --depth 1 --single-branch --branch master ${{ secrets.FORGEJO_HTTP }}://${{ secrets.FORGEJO_USERNAME }}:${{ secrets.FORGEJO_TOKEN }}@${{ secrets.FORGEJO_DOMAIN }}/${{ secrets.FORGEJO_ORG }}/degrees-of-lewdity.git repo-sync
          
      - name: 🔄 检测 GitGud 更新并同步
        run: |
          cd repo-sync
          
          # 1. 添加 GitGud 作为额外的远程仓库
          git remote add gitgud https://gitgud.io/Vrelnir/degrees-of-lewdity.git
          
          # 2. 尝试获取 GitGud 的最新状态
          echo "正在获取 GitGud 最新数据..."
          git fetch gitgud master
          
          # 3. 对比 Forgejo 和 GitGud 的最新提交哈希 (Commit Hash)
          FORGEJO_HEAD=$(git rev-parse HEAD)
          GITGUD_HEAD=$(git rev-parse gitgud/master)
          
          echo "----------------------------------------"
          echo "Forgejo 当前版本: $FORGEJO_HEAD"
          echo "GitGud  最新版本: $GITGUD_HEAD"
          echo "----------------------------------------"
          
          # 4. 判断是否需要更新
          if [ "$FORGEJO_HEAD" = "$GITGUD_HEAD" ]; then
            echo "✅ 两个版本完全一致，无需更新！"
          else
            echo "⚠️ 发现 GitGud 有新提交！正在准备更新 Forgejo..."
            
            # 将本地指针硬重置到 GitGud 的最新提交（完美衔接新历史）
            git reset --hard gitgud/master
            
            # 推送回 Forgejo。因为只是向后追加新提交，所以不需要 -f 强制推送
            # 这样绝对不会破坏 Forgejo 上已经存在的历史 Commit
            git push origin master
            
            echo "🎉 更新已成功推送到 Forgejo！"
          fi
